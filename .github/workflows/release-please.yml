name: release-please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run outside tankdonut/torus
        if: github.repository != 'tankdonut/torus'
        run: |
          echo "::error::release workflow copied to ${GITHUB_REPOSITORY}"
          exit 1
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
      - name: Dispatch ci at the release tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No checkout in this workflow: gh resolves the repo via git remotes,
        # so the repo must be passed explicitly or the step dies with
        # "not a git repository".
        run: gh workflow run ci.yml --repo "${{ github.repository }}" --ref "${{ steps.release.outputs.tag_name }}"
