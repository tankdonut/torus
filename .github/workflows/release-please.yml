name: release-please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
      - name: Dispatch ci at the release tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "${{ steps.release.outputs.tag_name }}"
