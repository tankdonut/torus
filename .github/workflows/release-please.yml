name: release-please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
      - name: Dispatch ci at the release tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No checkout in this workflow: gh resolves the repo via git remotes,
        # so the repo must be passed explicitly or the step dies with
        # "not a git repository".
        run: gh workflow run ci.yml --repo "${{ github.repository }}" --ref "${{ steps.release.outputs.tag_name }}"
