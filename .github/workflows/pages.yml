name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# PR runs never deploy: this workflow triggers on main pushes and manual dispatch only.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse to publish outside tankdonut/torus
        if: github.repository != 'tankdonut/torus'
        run: |
          echo "::error::publishing workflow copied to ${GITHUB_REPOSITORY}"
          exit 1
      # Full history: the site build derives repo stats (commit graph,
      # contributors) from git log at build time.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - run: npm run site:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
