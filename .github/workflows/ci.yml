name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - name: Load torus under stock pi (no credentials — providers skip, factory must load clean)
        run: |
          npm ci
          node runtime/bin/torus.mjs --list-models

  build:
    runs-on: ubuntu-latest
    name: build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            artifact: torus-linux-x64
          - target: bun-linux-arm64
            artifact: torus-linux-arm64
          - target: bun-darwin-x64
            artifact: torus-darwin-x64
          - target: bun-darwin-arm64
            artifact: torus-darwin-arm64
          - target: bun-windows-x64
            artifact: torus-windows-x64
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - name: Create .npmrc for the payload (release-age filter + legacy-peer-deps on first-run bootstrap)
        run: ./make.sh npmrc
      - name: Cross-compile launcher
        run: ./scripts/build-binary.sh dist/torus --target "${{ matrix.target }}"
      - name: Smoke the compiled launcher (x64 Linux runs natively on this runner)
        if: matrix.target == 'bun-linux-x64'
        run: |
          test -x dist/torus/bin/torus
          TORUS_PI_BIN="$PWD/node_modules/.bin/pi" dist/torus/bin/torus --list-models
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/torus
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - name: Build image (single-platform, loaded for tests)
        run: ./make.sh image torus:ci
      - name: Container test suite
        run: ./make.sh image-test torus:ci
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/tankdonut/torus
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-typecheck, smoke, build, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - name: Stage release binaries
        uses: actions/download-artifact@v8
        with:
          path: dist/release
      - name: Stage, checksum, and verify version consistency
        run: |
          mkdir -p dist/stage
          cd dist/release
          for d in torus-*; do
            src="$d/bin/torus"
            dest="torus-${d#torus-}"
            if [ -f "$d/bin/torus.exe" ]; then src="$d/bin/torus.exe"; dest="$dest.exe"; fi
            mv "$src" "../stage/$dest"
          done
          cd ../stage
          sha256sum torus-* > sha256sums.txt
          cd ../..
          tag_ver="${GITHUB_REF_NAME#v}"
          pkg_ver="$(node -p "require('./package.json').version")"
          bin_ver="$(TORUS_PI_BIN="$PWD/node_modules/.bin/pi" dist/stage/torus-linux-x64 --version | awk '{print $2}')"
          echo "tag=$tag_ver pkg=$pkg_ver bin=$bin_ver"
          [ "$tag_ver" = "$pkg_ver" ] && [ "$tag_ver" = "$bin_ver" ]
      - name: Attach binaries and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/stage/torus-* dist/stage/sha256sums.txt --clobber
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/stage/torus-*
