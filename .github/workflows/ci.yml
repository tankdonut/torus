name: ci
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  # Least privilege default; jobs that publish declare their own overrides.
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - run: npm run site:build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .tool-versions
      - name: Load torus under stock pi (no credentials — providers skip, factory must load clean)
        run: |
          npm ci
          node runtime/bin/torus.mjs --list-models

  build:
    runs-on: ubuntu-latest
    name: build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            artifact: torus-linux-x64
          - target: bun-linux-arm64
            artifact: torus-linux-arm64
          - target: bun-darwin-x64
            artifact: torus-darwin-x64
          - target: bun-darwin-arm64
            artifact: torus-darwin-arm64
          - target: bun-windows-x64
            artifact: torus-windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - name: Create .npmrc for the payload (release-age filter + legacy-peer-deps on first-run bootstrap)
        run: ./make.sh npmrc
      - name: Cross-compile launcher
        run: ./scripts/build-binary.sh dist/torus --target "${{ matrix.target }}"
      - name: Smoke the compiled launcher (x64 Linux runs natively on this runner)
        if: matrix.target == 'bun-linux-x64'
        run: |
          test -x dist/torus/bin/torus
          TORUS_PI_BIN="$PWD/node_modules/.bin/pi" dist/torus/bin/torus --list-models
      - name: Fresh-home determinism smoke (x64 Linux)
        if: matrix.target == 'bun-linux-x64'
        run: |
          H=$(mktemp -d)
          RT="$H/.torus/runtime"
          HOME="$H" dist/torus/bin/torus --version 2>"$H/first.err"
          grep -q 'extracting the bundled engine tree' "$H/first.err" \
            || { echo "first run must extract the bundled engine tree"; cat "$H/first.err"; exit 1; }
          ! grep -q 'npm ' "$H/first.err" \
            || { echo "first run must never invoke npm"; cat "$H/first.err"; exit 1; }
          HOME="$H" dist/torus/bin/torus --version 2>"$H/second.err"
          ! grep -Eq 'torus: .*(installing|bootstrapping|extracting)' "$H/second.err" \
            || { echo "second run must not reinstall or re-extract"; cat "$H/second.err"; exit 1; }
          # version source: the built payload lock once it exists, else the repo lock the payload embeds
          LOCK=package-lock.json
          if [ -f dist/payload-lock.json ]; then LOCK=dist/payload-lock.json; fi
          want() { node -p "JSON.parse(require('fs').readFileSync('$LOCK','utf8')).packages['node_modules/$1']?.version ?? ''"; }
          got() { node -p "require('$RT/node_modules/$1/package.json').version"; }
          for dep in zod undici '@earendil-works/pi-coding-agent'; do
            g=$(got "$dep")
            w=$(want "$dep")
            echo "$dep: installed $g, locked $w"
            if [ "$g" != "$w" ]; then
              echo "$dep must match $LOCK"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/torus
          if-no-files-found: error

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - run: npm audit --audit-level=high

  # The README's primary install path is `pi install git:github.com/tankdonut/torus@vX.Y.Z`:
  # the engine clones the tag and runs `npm install --omit=dev --legacy-peer-deps`
  # with lifecycle scripts enabled. Exercise that exact flow against this commit.
  package-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .tool-versions
      - name: Install from a fresh clone the way pi's git-install does
        run: |
          CLONE="$PWD/channel-clone"
          SCRATCH_HOME="$PWD/channel-home"
          mkdir -p "$SCRATCH_HOME"
          git clone --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$CLONE"
          # a plain clone carries branches and tags; PR runs test the merge ref
          git -C "$CLONE" fetch --quiet origin "$GITHUB_REF"
          git -C "$CLONE" checkout --quiet "$GITHUB_SHA"
          cd "$CLONE"
          HOME="$SCRATCH_HOME" npm install --omit=dev --legacy-peer-deps
          test ! -e node_modules/husky \
            || { echo "consumer installs must not pull in husky"; exit 1; }

  # Container pipeline: each platform builds exactly once per run and pushes
  # by digest; the multi-arch tag is assembled from those digests only after
  # the container test suite has passed against the amd64 image. PRs run the
  # same amd64 build + test suite in container-pr — no registry traffic, and
  # no job on an unreviewed ref holds a packages-write grant.
  container-pr:
    if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .tool-versions
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.2
      - name: Resolve .tool-versions pins for build args
        run: echo "BUN_VERSION=$(awk '$1=="bun"{print $2}' .tool-versions)" >> "$GITHUB_ENV"
      - name: Build test image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: torus:ci
          build-args: BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: |
            type=gha,scope=torus-amd64
            type=gha,scope=torus-arm64
          cache-to: type=gha,mode=max,scope=torus-amd64
      - name: Container test suite
        run: ./make.sh image-test torus:ci

  container:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      amd64_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Refuse to publish outside tankdonut/torus
        if: github.repository != 'tankdonut/torus'
        run: |
          echo "::error::publishing workflow copied to ${GITHUB_REPOSITORY}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .tool-versions
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.2
      - name: Resolve .tool-versions pins for build args
        run: echo "BUN_VERSION=$(awk '$1=="bun"{print $2}' .tool-versions)" >> "$GITHUB_ENV"
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta (image labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/tankdonut/torus
      # One build, pushed unnamed by digest; the step below pulls that exact
      # digest back as torus:ci so the suite tests the published object itself.
      # Multi-output builds (type=docker + push-by-digest in one build)
      # silently skip the registry push — see docker/build-push-action#1318.
      - name: Build amd64 image (push by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          build-args: BUN_VERSION=${{ env.BUN_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          outputs: type=image,name=ghcr.io/tankdonut/torus,push-by-digest=true,push=true
          cache-from: |
            type=gha,scope=torus-amd64
            type=gha,scope=torus-arm64
          cache-to: type=gha,mode=max,scope=torus-amd64
      - name: Stage pushed digest as torus:ci for the test suite
        run: |
          docker pull "ghcr.io/tankdonut/torus@${{ steps.build.outputs.digest }}"
          docker tag "ghcr.io/tankdonut/torus@${{ steps.build.outputs.digest }}" torus:ci
      - name: Container test suite
        run: ./make.sh image-test torus:ci

  # Native arm64 runner (free for public repos) — no QEMU emulation tax. Runs
  # parallel with the amd64 job; its digest is only ever tagged by
  # container-publish, which also gates on the tested amd64 build.
  container-arm64:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      arm64_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Refuse to publish outside tankdonut/torus
        if: github.repository != 'tankdonut/torus'
        run: |
          echo "::error::publishing workflow copied to ${GITHUB_REPOSITORY}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.2
      - name: Resolve .tool-versions pins for build args
        run: echo "BUN_VERSION=$(awk '$1=="bun"{print $2}' .tool-versions)" >> "$GITHUB_ENV"
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta (image labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/tankdonut/torus
      - name: Build arm64 image (push by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          build-args: BUN_VERSION=${{ env.BUN_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          outputs: type=image,name=ghcr.io/tankdonut/torus,push-by-digest=true,push=true
          cache-from: |
            type=gha,scope=torus-amd64
            type=gha,scope=torus-arm64
          cache-to: type=gha,mode=max,scope=torus-arm64

  # Assembles the multi-arch tags from the two platform digests. Runs only
  # when both platform jobs succeeded — a failing test suite means the digests
  # stay untagged (invisible to pullers) instead of publishing an untested image.
  container-publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [container, container-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Refuse to publish outside tankdonut/torus
        if: github.repository != 'tankdonut/torus'
        run: |
          echo "::error::publishing workflow copied to ${GITHUB_REPOSITORY}"
          exit 1
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta (published tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/tankdonut/torus
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Merge platform digests into multi-arch tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=("-t" "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${tag_args[@]}" \
            "ghcr.io/tankdonut/torus@${{ needs.container.outputs.amd64_digest }}" \
            "ghcr.io/tankdonut/torus@${{ needs.container-arm64.outputs.arm64_digest }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [audit, lint-typecheck, smoke, build, container-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Refuse to publish outside tankdonut/torus
        if: github.repository != 'tankdonut/torus'
        run: |
          echo "::error::publishing workflow copied to ${GITHUB_REPOSITORY}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - name: Stage release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist/release
      - name: Stage, checksum, and verify version consistency
        run: |
          mkdir -p dist/stage
          cd dist/release
          for d in torus-*; do
            src="$d/bin/torus"
            dest="torus-${d#torus-}"
            if [ -f "$d/bin/torus.exe" ]; then src="$d/bin/torus.exe"; dest="$dest.exe"; fi
            mv "$src" "../stage/$dest"
          done
          cd ../stage
          chmod +x torus-*
          sha256sum torus-* > sha256sums.txt
          cd ../..
          tag_ver="${GITHUB_REF_NAME#v}"
          pkg_ver="$(node -p "require('./package.json').version")"
          bin_ver="$(TORUS_PI_BIN="$PWD/node_modules/.bin/pi" dist/stage/torus-linux-x64 --version | awk '{print $2}')"
          echo "tag=$tag_ver pkg=$pkg_ver bin=$bin_ver"
          [ "$tag_ver" = "$pkg_ver" ] && [ "$tag_ver" = "$bin_ver" ]
      - name: Generate SBOM
        run: |
          mkdir -p dist/stage
          node scripts/generate-payload-lock.mjs
          node scripts/generate-sbom.mjs dist/payload-lock.json dist/stage/torus-sbom.cdx.json
      - name: Attach binaries, checksums, and SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/stage/torus-* dist/stage/sha256sums.txt --clobber
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/stage/torus-*
            dist/stage/sha256sums.txt
      - name: Attach attestation bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stage="$(pwd)/dist/stage"
          cd "$stage"
          for name in torus-* sha256sums.txt; do
            d="$(mktemp -d)"
            (cd "$d" && gh attestation download "$stage/$name" -R tankdonut/torus)
            cat "$d"/sha256*.jsonl > "$name.intoto.jsonl"
            rm -rf "$d"
          done
          cd ../..
          gh release upload "$GITHUB_REF_NAME" "$stage"/*.intoto.jsonl --clobber
