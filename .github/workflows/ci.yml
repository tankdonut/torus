name: ci
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - name: Load torus under stock pi (no credentials — providers skip, factory must load clean)
        run: |
          npm ci
          node runtime/bin/torus.mjs --list-models

  build:
    runs-on: ubuntu-latest
    name: build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            artifact: torus-linux-x64
          - target: bun-linux-arm64
            artifact: torus-linux-arm64
          - target: bun-darwin-x64
            artifact: torus-darwin-x64
          - target: bun-darwin-arm64
            artifact: torus-darwin-arm64
          - target: bun-windows-x64
            artifact: torus-windows-x64
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - name: Create .npmrc for the payload (release-age filter + legacy-peer-deps on first-run bootstrap)
        run: ./make.sh npmrc
      - name: Cross-compile launcher
        run: ./scripts/build-binary.sh dist/torus --target "${{ matrix.target }}"
      - name: Smoke the compiled launcher (x64 Linux runs natively on this runner)
        if: matrix.target == 'bun-linux-x64'
        run: |
          test -x dist/torus/bin/torus
          TORUS_PI_BIN="$PWD/node_modules/.bin/pi" dist/torus/bin/torus --list-models
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/torus
          if-no-files-found: error

  # Container pipeline: each platform builds exactly once per run and pushes
  # by digest; the multi-arch tag is assembled from those digests only after
  # the container test suite has passed against the amd64 image. PRs run the
  # amd64 build + test suite only — no arm64, no registry traffic.
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      amd64_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: docker/setup-buildx-action@v4
      - name: Resolve .tool-versions pins + publish flag
        run: |
          echo "NODE_VERSION=$(awk '$1=="nodejs"{print $2}' .tool-versions)" >> "$GITHUB_ENV"
          echo "BUN_VERSION=$(awk '$1=="bun"{print $2}' .tool-versions)" >> "$GITHUB_ENV"
          publishing=false
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) publishing=true ;;
          esac
          echo "PUBLISHING=$publishing" >> "$GITHUB_ENV"
      - name: Login to GHCR
        if: env.PUBLISHING == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta (image labels)
        if: env.PUBLISHING == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/tankdonut/torus
      # PR path: one docker-format load for the test suite. No registry push,
      # no arm64 — the publish machinery below is skipped entirely.
      - name: Build test image (amd64)
        if: env.PUBLISHING != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: torus:ci
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: |
            type=gha,scope=torus-amd64
            type=gha,scope=torus-arm64
          cache-to: type=gha,mode=max,scope=torus-amd64
      # Publish path: one build, pushed unnamed by digest; the step below
      # pulls that exact digest back as torus:ci so the suite tests the
      # published object itself. Multi-output builds (type=docker +
      # push-by-digest in one build) silently skip the registry push — see
      # docker/build-push-action#1318 — hence the pull-back.
      - name: Build amd64 image (push by digest)
        if: env.PUBLISHING == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            BUN_VERSION=${{ env.BUN_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          outputs: type=image,name=ghcr.io/tankdonut/torus,push-by-digest=true,push=true
          cache-from: |
            type=gha,scope=torus-amd64
            type=gha,scope=torus-arm64
          cache-to: type=gha,mode=max,scope=torus-amd64
      - name: Stage pushed digest as torus:ci for the test suite
        if: env.PUBLISHING == 'true'
        run: |
          docker pull "ghcr.io/tankdonut/torus@${{ steps.build.outputs.digest }}"
          docker tag "ghcr.io/tankdonut/torus@${{ steps.build.outputs.digest }}" torus:ci
      - name: Container test suite
        run: ./make.sh image-test torus:ci

  # Native arm64 runner (free for public repos) — no QEMU emulation tax. Runs
  # parallel with the amd64 job; its digest is only ever tagged by
  # container-publish, which also gates on the tested amd64 build.
  container-arm64:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      arm64_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Resolve .tool-versions pins for build args
        run: |
          echo "NODE_VERSION=$(awk '$1=="nodejs"{print $2}' .tool-versions)" >> "$GITHUB_ENV"
          echo "BUN_VERSION=$(awk '$1=="bun"{print $2}' .tool-versions)" >> "$GITHUB_ENV"
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta (image labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/tankdonut/torus
      - name: Build arm64 image (push by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            BUN_VERSION=${{ env.BUN_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          outputs: type=image,name=ghcr.io/tankdonut/torus,push-by-digest=true,push=true
          cache-from: |
            type=gha,scope=torus-amd64
            type=gha,scope=torus-arm64
          cache-to: type=gha,mode=max,scope=torus-arm64

  # Assembles the multi-arch tags from the two platform digests. Runs only
  # when both platform jobs succeeded — a failing test suite means the digests
  # stay untagged (invisible to pullers) instead of publishing an untested image.
  container-publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [container, container-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta (published tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/tankdonut/torus
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Merge platform digests into multi-arch tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=("-t" "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${tag_args[@]}" \
            "ghcr.io/tankdonut/torus@${{ needs.container.outputs.amd64_digest }}" \
            "ghcr.io/tankdonut/torus@${{ needs.container-arm64.outputs.arm64_digest }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-typecheck, smoke, build, container-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - name: Stage release binaries
        uses: actions/download-artifact@v8
        with:
          path: dist/release
      - name: Stage, checksum, and verify version consistency
        run: |
          mkdir -p dist/stage
          cd dist/release
          for d in torus-*; do
            src="$d/bin/torus"
            dest="torus-${d#torus-}"
            if [ -f "$d/bin/torus.exe" ]; then src="$d/bin/torus.exe"; dest="$dest.exe"; fi
            mv "$src" "../stage/$dest"
          done
          cd ../stage
          chmod +x torus-*
          sha256sum torus-* > sha256sums.txt
          cd ../..
          tag_ver="${GITHUB_REF_NAME#v}"
          pkg_ver="$(node -p "require('./package.json').version")"
          bin_ver="$(TORUS_PI_BIN="$PWD/node_modules/.bin/pi" dist/stage/torus-linux-x64 --version | awk '{print $2}')"
          echo "tag=$tag_ver pkg=$pkg_ver bin=$bin_ver"
          [ "$tag_ver" = "$pkg_ver" ] && [ "$tag_ver" = "$bin_ver" ]
      - name: Attach binaries and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/stage/torus-* dist/stage/sha256sums.txt --clobber
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/stage/torus-*
